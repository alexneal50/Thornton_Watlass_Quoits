<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results &mdash; Thornton Watlass Quoits</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="club" href="index.html"><span class="dot"></span>Thornton Watlass Quoits
      <small>North Yorkshire Quoits League</small>
    </a>
    <div class="navblock">
      <nav>
        <a href="index.html">League</a>
        <a href="team.html">Our Team</a>
        <a href="results.html" class="active">Results</a>
        <a href="fixtures.html">Fixtures</a>
        <a href="cup.html">Cup</a>
        <a href="admin.html">Enter Scores</a>
      </nav>
      <div class="user-chip" id="user-chip"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page-hero">
    <img src="quoit.svg" alt="" class="quoit-icon" aria-hidden="true">
    <h1>Results</h1>
  </div>
  <p class="lede">Every Thornton Watlass result &mdash; League, Cup, and Captains Cup.</p>

  <div class="season-select-wrap">
    <label for="season-select">Season</label>
    <select id="season-select"></select>
  </div>

  <div id="matches-slot"></div>
</main>

<footer class="wrap">
  Thornton Watlass Quoits Club
</footer>

<script src="stats.js"></script>
<script type="module">
import { watchAuthStatus } from './auth.js';
watchAuthStatus();
</script>
<script>
async function renderPage() {
  const HOME_TEAM = 'Thornton Watlass';
  try {
    const data = await loadData();
    const { rows } = computeTeamStats(data, HOME_TEAM);

    const years = computeSeasonList(data);
    const select = document.getElementById('season-select');
    select.innerHTML = `<option value="all">All seasons</option>` +
      years.map(y => `<option value="${y}">${y}</option>`).join('');
    select.value = defaultSeason(years);

    function renderMatches() {
      const chosen = select.value;
      const filtered = chosen === 'all' ? rows : rows.filter(r => String(new Date(r.date).getFullYear()) === chosen);
      const slot = document.getElementById('matches-slot');

      if (filtered.length === 0) {
        slot.innerHTML = `<p class="empty">No results ${chosen === 'all' ? 'recorded yet' : `for ${chosen}`}.</p>`;
        return;
      }

      slot.innerHTML = filtered.map(r => {
        const pillClass = r.outcome === 'win' ? 'win' : r.outcome === 'loss' ? 'loss' : 'draw';
        const gameRows = r.games.map(g => {
          const hi = r.isHome;
          const ourP = hi ? g.homePlayer : g.awayPlayer;
          const theirP = hi ? g.awayPlayer : g.homePlayer;
          const ourS = hi ? g.homeScore : g.awayScore;
          const theirS = hi ? g.awayScore : g.homeScore;
          return `<tr><td>${ourP}</td><td class="num">${ourS}&ndash;${theirS}</td><td>${theirP}</td></tr>`;
        }).join('');
        return `
          <div class="card" style="margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
              <h3 style="margin:0;">vs ${r.opponent} <span style="font-weight:400; color:var(--ink-soft); font-size:.85rem;">(${r.isHome ? 'Home' : 'Away'})</span></h3>
              <div style="display:flex; gap:6px;">
                <span class="pill ${matchTypePillClass(r.type)}">${matchTypeLabel(r.type).toUpperCase()}</span>
                <span class="pill ${pillClass}">${r.outcome.toUpperCase()} &middot; ${r.teamMatchPoints}&ndash;${r.oppMatchPoints}</span>
              </div>
            </div>
            <p style="color:var(--ink-soft); font-size:.85rem; margin:2px 0 10px;">${formatDate(r.date)} &middot; ${r.teamGames}&ndash;${r.oppGames} games &middot; ${r.teamPts}&ndash;${r.oppPts} points</p>
            <table class="scores"><tbody>${gameRows}</tbody></table>
          </div>`;
      }).join('');
    }

    select.addEventListener('change', () => { rememberSeason(select.value); renderMatches(); });
    renderMatches();
  } catch (e) {
    document.querySelector('main').innerHTML = `<p class="msg err">Couldn't load data.json &mdash; ${e.message}</p>`;
  }

  function formatDate(d) {
    return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
}
renderPage();
</script>
</body>
</html>
