  <ellipse cx="60" cy="104" rx="34" ry="7" fill="url(#contact)"/>

  <circle cx="60" cy="58" r="38" fill="none" stroke="url(#steel)" stroke-width="21"/>
  <circle cx="60" cy="58" r="38" fill="none" stroke="url(#shine)" stroke-width="9"
          stroke-dasharray="46 220" stroke-linecap="round" transform="rotate(-52 60 58)"/>
  <circle cx="60" cy="58" r="38" fill="none" stroke="#FFFFFF" stroke-width="2"
          stroke-dasharray="10 250" stroke-linecap="round" transform="rotate(128 60 58)" opacity="0.5"/>
