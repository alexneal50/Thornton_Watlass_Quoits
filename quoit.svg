<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A metal quoit ring" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="steel" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F4F5F7"/>
      <stop offset="30%" stop-color="#C7CCD2"/>
      <stop offset="55%" stop-color="#8C929A"/>
      <stop offset="80%" stop-color="#5A6069"/>
      <stop offset="100%" stop-color="#33373D"/>
    </linearGradient>
    <radialGradient id="shine" cx="32%" cy="26%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
